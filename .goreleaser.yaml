version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: doriath
    main: ./
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/anduintransaction/doriath/utils.Version={{.Version}} -X github.com/anduintransaction/doriath/utils.Commit={{.Commit}}

archives:
  - id: doriath
    ids:
      - doriath
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: ["tar.gz"]
    files:
      - none*

changelog:
  disable: true

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "dev-snapshot"
